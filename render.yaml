services:
  - type: web
    name: aneesh-portfolio
    runtime: python
    branch: main
    rootDir: AiDD_Assignment07
    plan: starter
    autoDeployTrigger: commit
    healthCheckPath: /
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -b 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: SECRET_KEY
        generateValue: true
