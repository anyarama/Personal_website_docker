{% extends "base.html" %}

{% block content %}
<section class="error-section">
  <div class="container error-card card-showcase">
    <p class="eyebrow">404</p>
    <h1>That page is not in the portfolio.</h1>

    <div class="hero-actions">
      <a class="button button-primary" href="{{ url_for('index') }}">Back to Home</a>
      <a class="button button-secondary" href="{{ url_for('projects') }}">View Portfolio</a>
    </div>
  </div>
</section>
{% endblock %}
